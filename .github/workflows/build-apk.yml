name: Build Apni Pathshala APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install natural voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user --upgrade edge-tts

      - name: Generate bundled natural voices
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p app/src/main/assets/audio

          speak() {
            file="$1"; voice="$2"; text="$3"
            for attempt in 1 2 3; do
              rm -f "app/src/main/assets/audio/$file"
              if edge-tts --voice "$voice" --rate="-10%" --pitch="+0Hz" --text "$text" --write-media "app/src/main/assets/audio/$file" && test -s "app/src/main/assets/audio/$file"; then
                return 0
              fi
              echo "Voice generation retry $attempt for $file"
              sleep 3
            done
            echo "Failed to generate $file"
            exit 1
          }

          speak home.mp3 en-US-AnaNeural "Welcome to Apni Pathshala. Let's learn and play."

          words=("A|Apple|सेब" "B|Ball|गेंद" "C|Cat|बिल्ली" "D|Dog|कुत्ता" "E|Elephant|हाथी" "F|Fish|मछली" "G|Grapes|अंगूर" "H|Hen|मुर्गी" "I|Ice cream|आइसक्रीम" "J|Jug|जग" "K|Kite|पतंग" "L|Lion|शेर" "M|Mango|आम" "N|Nest|घोंसला" "O|Orange|संतरा" "P|Parrot|तोता" "Q|Queen|रानी" "R|Rabbit|खरगोश" "S|Sun|सूरज" "T|Tiger|बाघ" "U|Umbrella|छाता" "V|Van|गाड़ी" "W|Watch|घड़ी" "X|Xylophone|जाइलोफोन" "Y|Yak|याक" "Z|Zebra|ज़ेब्रा")
          for item in "${words[@]}"; do
            IFS='|' read -r l w h <<< "$item"
            speak "abc_${l}.mp3" en-US-AnaNeural "${l} for ${w}. ${w} means ${h}."
          done

          hindi=("अ|अनार" "आ|आम" "इ|इमली" "ई|ईख" "उ|उल्लू" "ऊ|ऊट" "ऋ|ऋषि" "ए|एकतार" "ऐ|ऐनक" "ओ|ओखली" "औ|औरत" "अं|अंगूर" "अः|" "क|कबूतर" "ख|खरगोश" "ग|गमला" "घ|घड़ी" "ङ|" "च|चम्मच" "छ|छाता" "ज|जहाज" "झ|झंडा" "ञ|" "ट|टमाटर" "ठ|ठठेरा" "ड|डमरू" "ढ|ढक्कन" "ण|" "त|तरबूज" "थ|थर्मस" "द|दवात" "ध|धनुष" "न|नल" "प|पतंग" "फ|फल" "ब|बत्तख" "भ|भालू" "म|मछली" "य|यज्ञ" "र|रथ" "ल|लट्टू" "व|वक" "श|शलजम" "ष|षट्कोण" "स|सपेरा" "ह|हल" "क्ष|क्षत्रिय" "त्र|त्रिशूल" "ज्ञ|ज्ञानी")
          i=0
          for item in "${hindi[@]}"; do
            IFS='|' read -r l w <<< "$item"
            if [ -n "$w" ]; then text="${l} से ${w}"; else text="${l}"; fi
            printf -v n "%02d" "$i"
            speak "hindi_${n}.mp3" hi-IN-SwaraNeural "$text"
            i=$((i+1))
          done

          for n in $(seq 1 100); do
            printf -v f "number_%03d.mp3" "$n"
            speak "$f" en-US-AnaNeural "$n"
          done

          count=$(find app/src/main/assets/audio -type f -name '*.mp3' | wc -l)
          echo "Natural voice files: $count"
          test "$count" -eq 175
          for f in app/src/main/assets/audio/*.mp3; do test -s "$f"; done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apni-pathshala-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
